# Newest stable releases and pre-releases of every supported client.
# Not triggered on pull_request, so a red run is visible in Actions and via
# workflow_dispatch, and it is not a required PR check.
# Pre-release failures must stay failing (no continue-on-error).
# Runners are ubuntu-24.04. Do not switch these jobs to ubuntu-latest.

name: Client compatibility

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clients:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        channel: [stable, pre]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (pycurl)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install ${{ matrix.channel }} clients
        run: |
          set -euo pipefail
          packages=(urllib3 requests aiohttp httpx pycurl cloudscraper autoscraper)
          if [ "${{ matrix.channel }}" = "pre" ]; then
            pip install --pre --upgrade "${packages[@]}"
          else
            pip install --upgrade "${packages[@]}"
          fi
          python - <<'PY'
          import importlib.metadata as metadata
          names = (
              "urllib3",
              "requests",
              "aiohttp",
              "httpx",
              "httpcore",
              "pycurl",
              "cloudscraper",
              "autoscraper",
          )
          for name in names:
              try:
                  print(f"{name}=={metadata.version(name)}")
              except metadata.PackageNotFoundError:
                  print(f"{name}==not-installed")
          PY

      - name: Run header security unit tests
        run: python test_header_security.py

      - name: Run local mock-proxy internal tests
        run: python test_client_internals.py
