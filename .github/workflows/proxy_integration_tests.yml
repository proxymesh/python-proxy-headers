# Pull-request checks.
# - unit: Python matrix, compatible client extras, header tests, and a local
#   CONNECT mock (no PROXY_URL).
# - integration: real proxy via the PROXY_URL secret. pull_request events only
#   receive secrets for PRs from this repository, not from forks.
#
# Pre-release clients are not installed here. The weekly Client compatibility
# workflow runs `pip install --pre` and is not a pull_request check, so a
# pre-release failure cannot block a PR.
# Runners are ubuntu-24.04. Do not switch these jobs to ubuntu-latest.

name: Proxy integration tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (pycurl)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Install package and compatible client extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[urllib3,requests,httpx,aiohttp,pycurl,cloudscraper,autoscraper]"

      - name: Run header security unit tests
        run: python test_header_security.py

      - name: Run local mock-proxy internal tests
        run: python test_client_internals.py

  integration:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install system dependencies (pycurl)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Install package and compatible client extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[urllib3,requests,httpx,aiohttp,pycurl,cloudscraper,autoscraper]"

      - name: Require PROXY_URL Actions secret
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          if [ -z "${PROXY_URL}" ]; then
            echo "::error::PROXY_URL is not set. Add a repository (or environment) secret named PROXY_URL under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Run integration tests
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python test_proxy_headers.py
